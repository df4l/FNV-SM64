; SM64FNV settings. Read once at game start.

[General]
; 1 = Mario is active when the game starts, 0 = start with the vanilla player (toggle with iToggleKey).
bStartActive=1

[Debug]
; Master toggle key: switches Mario on/off (Win32 virtual-key code). 0x77 = F8.
iToggleKey=0x77
; Key that prints the tick/game state to the console and the log (Win32 virtual-key code). 0x79 = F10.
iDumpStateKey=0x79

[Subsystems]
; Each switch turns one part of the plugin off without rebuilding (for bisecting problems).
; 1 = the player is moved onto Mario every frame, 0 = Mario runs on his own and the player is left alone.
bPlayerFollow=1
; 1 = the player's movement controls are disabled while they follow Mario (as DisablePlayerControls does),
; 0 = leave them on.
bDisableControls=1
; 1 = Mario's mesh is drawn (M3), 0 = no mesh.
bRender=1
; 1 = hide your own character's 3rd-person body while Mario is spawned, 0 = leave it visible.
bHidePlayer=1
; 1 = Mario uses your game controls as bound in the game's Controls settings: Forward/Back/Left/Right move,
; Jump = jump, Attack = punch, Sneak = crouch, hold Run to walk. With a gamepad, the left stick moves him
; (tilt = speed). 0 = Mario gets no input.
bInput=1

[Render]
; 1 = reverse the triangle order. Use it if Mario looks inside out (you see his back faces/insides).
bFlipWinding=0
; 1 = draw the textured parts (face, eyes, moustache, buttons, cap logo) over the coloured mesh, 0 = colours only.
bTexture=1
; 1 = swap red and blue in the texture. Use it if the eyes look brown/orange instead of blue.
bTextureSwapRB=0
; How far (game units) the textured parts sit above the coloured mesh. Raise it if the face flickers, lower it if
; the face looks like it floats.
fDecalOffset=0.1
; 1 = smooth: Mario's mesh and the player are blended between SM64's 30 Hz ticks every frame. 0 = 30 Hz steps.
bInterpolate=1
; 1 = tint Mario by the game's sun light (day/night, weather, interior lighting), 0 = always full bright.
bLighting=1
; Weight of the sun's direct (diffuse) colour in the tint, on top of the ambient colour.
fLightDiffuse=0.5
; Overall multiplier of the tint. Raise it if Mario looks too dark compared to the world.
fLightBrightness=1.0
; Lowest tint per colour channel, so Mario never turns fully black at night.
fLightMin=0.08

[Camera]
; How far (game units) you can zoom the 3rd-person camera out while Mario is active. The game's own limit
; (fChaseCameraMax, 120 by default; fVanityModeWheelMax, 250, used while the controller zooms with POV held) is
; restored when Mario despawns. 0 = keep the game's limits.
fMaxZoomDist=500
; After loading a save or starting a new game, switch to 3rd person and zoom fully out when Mario spawns.
bThirdPersonOnLoad=1
; Keep 3rd person while Mario is out: the POV key or scrolling all the way in is undone the next frame. If you
; were in 1st person when Mario appeared, turning him off with the toggle key puts you back in 1st person.
bForceThirdPerson=1
; Zoom distance used when the view is pushed back to 3rd person (game units; fMaxZoomDist is the far limit).
fMinZoomDist=150

[Collision]
; 1 = Mario stands on the real terrain outside.
; 0 = a flat invisible floor at the height where Mario appears, as before (outside only).
bTerrain=1
; 1 = Mario also collides with the fixed collision of nearby objects (buildings, rocks, fences, interior walls
; and floors, doors, lifts, larger loose objects). 0 = interiors use the flat floor.
bStatics=1
; Objects are loaded this far around Mario (game units; 4096 = one cell). Larger = more
; triangles and a slower Mario tick (F10 shows the cost).
fStaticRadius=4096
; Upper limit on loaded object triangles.
iMaxStaticTriangles=150000
; 1 = reverse the triangle winding of object meshes (only if the log says most meshes are "inward").
bStaticFlipWinding=0
; 1 = doors block Mario. Doors that don't animate (and all doors when bMovingBodies=0) stay in the position they had
; when the collision was last built. 0 = no door collision.
bDoors=1
; 1 = animated doors, lifts and moving platforms move their collision with them every tick, and Mario rides
; on them. Doors that never move keep the bDoors behaviour. 0 = doors are fixed in their pose (bDoors), lifts and
; loose objects ignored (this also turns bDynamicBodies off).
bMovingBodies=1
; Nearest moving bodies (doors, lifts, loose objects) kept around Mario per rebuild, and the triangle cap for each one.
iMaxMovingBodies=128
iMaxMovingTriangles=4096
; 1 = larger loose objects (crates, barrels, furniture) block Mario and he can stand on them; they follow the game's
; physics if something moves them. 0 = Mario goes through them.
bDynamicBodies=1
; A loose object counts only if its largest side is at least this (game units). Lower = smaller clutter collides too.
fMinDynamicSize=40
; 1 = interior building pieces that hold floor, walls and ceiling in one mesh get their floors facing up and
; ceilings facing down (fixes invisible walls where Mario stops for no visible reason). 0 = stored winding.
bRoomPieces=1
; 1 = rebuild the ground and objects around Mario as he travels (outside and inside). 0 = only around the spot where he appears.
bStreaming=1
; Mario this far from where the collision was last built (game units) triggers a rebuild. Keep it well below
; fStaticRadius. Each rebuild takes some milliseconds (F10 shows it).
fReloadDistance=2048

[Input]
; Gamepad left-stick deadzone (0..1). Below this tilt Mario stands still; above it the speed ramps from 0 to full.
; Lower it if small tilts feel ignored, raise it if Mario creeps when you let go of the stick.
fStickDeadzone=0.24
; 1 = while Mario is active, the game ignores Attack, Aim/Block, Ready weapon/Reload, VATS, the hotkeys (and ammo
; swap) and Grab, so your hidden character doesn't fire, draw, aim, reload or enter VATS. Activate, Pip-Boy, Wait and quicksave still work.
bBlockGameControls=1
; 1 = keep the HUD (crosshair, health, compass) visible while Mario is active. 0 = hide it, as the game does
; whenever player movement is disabled.
bShowHud=1

[Audio]
; 1 = Mario's voice and sound effects play through the game's own sound output. The game's Master and Effects
; volume sliders control them like any game sound effect. 0 = silent (the sound banks aren't even loaded).
bAudio=1
; Extra volume for Mario on top of the game's sliders, 0..1 (1 = as loud as a game sound effect).
fVolume=1.0

[Gameplay]
; 1 = Mario's health follows your character's: full above fLowHealth, low (he pants when idle) at or below it,
; and he dies when you die. His own damage (long falls) takes health from your character.
bHealthSync=1
; Fraction of your character's health (0..1) at or below which Mario is low on health.
fLowHealth=0.25
; 1 = Mario swims in the game's water (rivers, lakes, flooded interiors).
bWater=1
; 1 = the water level is given to Mario only while your character touches water, as in GTA SA. 0 = whenever the
; game knows a water level where you stand (try 0 if Mario walks on the river bed instead of swimming).
bWaterNeedsContact=1
; 1 = living NPCs and creatures near Mario push him back (as peds do in GTA SA). Each gets an upright cylinder at its
; feet; Mario can still jump over it.
bNpcColliders=1
; How many of the nearest actors get a collider, and how far from Mario they are looked for (game units).
iMaxNpcColliders=32
fNpcRange=1500
; Cylinder size: 1 = from each actor's base form bounds (its object bounds box: the mean of its half width and
; half length as the radius, its top as the height), times fNpcBoundsScale and the actor's scale. Actors without
; usable bounds, or bNpcBounds=0, use fNpcRadius / fNpcHeight (game units, times the actor's scale).
bNpcBounds=1
fNpcBoundsScale=1.0
fNpcRadius=20
fNpcHeight=120
; 1 = Mario's punches, kicks, slides and stomps damage the actors that have a collider (needs bNpcColliders=1).
; The game treats you as the attacker: friendly NPCs turn hostile, as if you had hit them.
bNpcAttacks=1
; Reach of a hit in game units, measured from the edge of the actor's cylinder: on the ground sideways; in the air
; sideways and above/below the cylinder.
fAttackReach=65
fAttackReachAir=50
; One damage per strike (the first tick of a punch's contact). Minimum ticks (1/30 s) between two damaging strikes
; on the same actor.
iAttackCooldown=4
; Mario's bounce-back after a punch or kick lands. 1 = SM64/GTA SA (he hops ~100 units back, out of reach of the
; next punch of a combo), 0 = none.
fPunchRecoil=0.25
; 1 = a punch does what your character's bare-handed punch does (Unarmed skill and the UnarmedDamage stat, as the
; game computes them), reduced by the target's DT/DR like a normal hit (no criticals, sneak bonus or perks).
; 0 = a fixed fAttackDamage per punch that ignores armour (GTA SA: 20).
iDamageMode=1
fAttackDamage=20
; Multiplier on every hit, both modes.
fDamageMult=5.0
; Multipliers per move (GTA SA ratios). Kick: jump kick, slide kick, butt and belly slides, which also knock the
; actor down. Ground pound: while falling. Metal cap: on top of the move, and it also knocks down.
fKickMult=1.5
fGroundPoundMult=3.5
fMetalCapMult=11
; Knockdown strength (as the PushActorAway console command). 0 = damage only, no knockdown.
iKnockForce=40
